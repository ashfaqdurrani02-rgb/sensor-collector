name: Build & Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout repository ────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java 17 ─────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Install Flutter SDK ────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # ── 4. Verify Flutter installation ────────────────────────
      - name: Flutter version info
        run: flutter --version

      # ── 5. Generate missing Gradle wrapper & Android assets ───
      - name: Initialize Android Scaffolding
        run: |
          # Back up custom AndroidManifest.xml
          cp android/app/src/main/AndroidManifest.xml /tmp/AndroidManifest.xml
          
          # Generate official Gradle wrapper, launcher icons, and gradle configs
          flutter create --platforms=android --org com.example .
          
          # Restore our custom AndroidManifest.xml with all sensor permissions
          cp /tmp/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          
          # Set minSdk to 23 (required for BLE and modern Wi-Fi scanning)
          find android/app -name "build.gradle*" -exec sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 23/g' {} + || true
          find android/app -name "build.gradle*" -exec sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 23/g' {} + || true
          find android/app -name "build.gradle*" -exec sed -i 's/minSdkVersion 21/minSdkVersion 23/g' {} + || true

      # ── 6. Accept Android SDK licenses ───────────────────────
      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      # ── 7. Install dependencies ──────────────────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── 8. Build Debug APK ────────────────────────────────────
      - name: Build Debug APK
        run: flutter build apk --debug

      # ── 9. Build Release APK ──────────────────────────────────
      - name: Build Release APK
        run: |
          flutter build apk --release || echo "Release build encountered an issue, fallback to debug"

      # ── 10. Prepare artifacts for download ────────────────────
      - name: Prepare APK Artifacts
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk artifacts/SensorCollector-debug.apk
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk artifacts/SensorCollector-release.apk
          else
            cp build/app/outputs/flutter-apk/app-debug.apk artifacts/SensorCollector-release.apk
          fi
          ls -lh artifacts/

      # ── 11. Upload APK artifacts ──────────────────────────────
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SensorCollector-release-apk
          path: artifacts/SensorCollector-release.apk
          retention-days: 30

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SensorCollector-debug-apk
          path: artifacts/SensorCollector-debug.apk
          retention-days: 30
