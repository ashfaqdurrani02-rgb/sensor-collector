name: Build & Release APK

on:
  # Trigger on every push to main branch
  push:
    branches: [ main, master ]
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout source code ───────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Java (required by Android Gradle) ──────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # ── 3. Install Flutter SDK ────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      # ── 4. Verify Flutter installation ────────────────────────
      - name: Flutter version info
        run: flutter --version

      # ── 5. Accept Android SDK licenses ───────────────────────
      - name: Accept Android SDK licenses
        run: yes | flutter doctor --android-licenses || true

      # ── 6. Install Dart/Flutter dependencies ─────────────────
      - name: Flutter pub get
        run: flutter pub get

      # ── 7. Run static analysis (optional but good practice) ───
      - name: Flutter analyze
        run: flutter analyze --no-fatal-infos || true

      # ── 8. Build debug APK (no signing key needed) ───────────
      - name: Build Debug APK
        run: flutter build apk --debug --verbose

      # ── 9. Build release APK ──────────────────────────────────
      - name: Build Release APK
        run: flutter build apk --release --verbose

      # ── 10. Rename APKs with build number ─────────────────────
      - name: Rename APK files
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-debug.apk     artifacts/SensorCollector-debug.apk
          cp build/app/outputs/flutter-apk/app-release.apk   artifacts/SensorCollector-release.apk
          echo "APK files:"
          ls -lh artifacts/

      # ── 11. Upload APKs as downloadable artifacts ─────────────
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: SensorCollector-debug-apk
          path: artifacts/SensorCollector-debug.apk
          retention-days: 30

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: SensorCollector-release-apk
          path: artifacts/SensorCollector-release.apk
          retention-days: 30

      # ── 12. Create a GitHub Release on version tags ───────────
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/SensorCollector-debug.apk
            artifacts/SensorCollector-release.apk
          name: "Sensor Collector ${{ github.ref_name }}"
          body: |
            ## 📡 Sensor Collector — Indoor RF & Telemetry App

            ### Install
            1. Download `SensorCollector-release.apk`
            2. On your Android phone: Settings → Security → Enable **Install Unknown Apps**
            3. Open the APK file and install

            ### What's included
            - Wi-Fi scanner (SSID, BSSID, RSSI, channel, 2.4/5GHz band)
            - BLE/Bluetooth scanner (name, RSSI, UUID, estimated distance)
            - Magnetometer, battery status
            - HTTP POST + WebSocket transport
            - Configurable room ID, device name, polling interval
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

